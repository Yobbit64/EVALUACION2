<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!-- Interfaz visual con Bootstrap -->
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-sm-5">
                        <h2 class="text-center mb-4">Iniciar Sesión</h2>

                        <!-- Mensaje de error en caso de que las credenciales no sean válidas -->
                        {% if error %}
                            <div class="alert alert-danger" role="alert">
                                {{ error }}
                            </div>
                        {% endif %}

                        <!-- Envía la información al servidor con el método POST, el cual es seguro -->
                        <form method="post" action="{% url 'login' %}">
                            <!-- Este token de seguridad evita ataques CSRF -->
                            {% csrf_token %}

                            <!-- Se ingresa el RUT, el cual es obligatorio -->
                            <div class="mb-3">
                                <label for="rut" class="form-label fw-bold">RUT del Empleado:</label>
                                <input type="text" class="form-control" id="rut" name="rut" placeholder="Ej: 11111111-1" required autocomplete="off">
                            </div>

                            <!-- Se ingresa la contraseña, la cual es ocultada dentro del campo -->
                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold">Contraseña:</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>

                            <!-- Botón que ejecuta el envío de la información -->
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
