{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0 text-center">Registrar Vehículo Vendido</h3>
        </div>
        <div class="card-body">
            <div class="text-center mb-4">
                <img src="{% static 'gestion/img/business-agreement-handshake-hand-gesture.jpg' %}" alt="Venta" class="img-fluid rounded" style="max-height: 200px; object-fit: cover; width: 100%;">
            </div>

            <!-- Define un formulario que enviará los datos mediante POST (es seguro) -->
            <form method="post">
                <!-- Este token de seguridad evita ataques CSRF -->
                {% csrf_token %}
                <!-- Muestra los campos del formulario donde ingresar los datos -->
                {{ form.as_p }}
                
                <div class="d-grid gap-2 mt-4">
                    <!-- Crea un botón que registra los datos ingresados al ejecutarlo -->
                    <button type="submit" class="btn btn-primary">Registrar Venta</button>
                    <!-- Crea un botón que redirige a la página principal al ejecutarlo -->
                    <a href="{% url 'index' %}" class="btn btn-secondary">Volver al Menú Principal</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
