<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Cliente y Vehículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 700px;">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0 text-center">Agregar Cliente y Vehículo</h3>
        </div>
        <div class="card-body">
            
            <!-- Inicia un único formulario que enviará los datos del cliente y vehiculo de forma simultanea-->
            <form method="post">
                <!-- Este token de seguridad evita ataques CSRF -->
                {% csrf_token %}
                
                <h5 class="text-secondary border-bottom pb-2 mb-3">1. Datos del Cliente</h5>
                <!-- Muestra los campos de la instancia form_cliente, donde se ingresan los datos del cliente -->
                {{ form_cliente.as_p }}

                <!-- Un mensaje al usuario que explica que si el RUT ingresado existe, el vehículo de asociará a tal RUT -->
                <small class="text-muted mb-4 d-block">
                    * Si el RUT ya existe en el sistema, el vehículo se asociará a ese cliente.
                </small>

                <h5 class="text-secondary border-bottom pb-2 mb-3 mt-4">2. Datos del Vehículo</h5>
                <!-- Muestra los campos de la instancia form_vehiculo, donde se ingresan los datos del vehículo -->
                {{ form_vehiculo.as_p }}
                
                <div class="d-grid gap-2 mt-5">
                    <!-- Botón que despachará ambos formularios a la vez al ejecutarlo -->
                    <button type="submit" class="btn btn-success btn-lg">Guardar Registro Completo</button>
                    <a href="{% url 'index' %}" class="btn btn-outline-secondary">Volver al Menú Principal</a>
                </div>
            </form>
            
        </div>
    </div>
</div>
</body>
</html>
